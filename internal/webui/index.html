<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FileGate — ファイルの検査</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar"><div class="brand">FileGate <span>LOCAL</span></div><button id="logout" class="quiet" type="button" hidden>接続を終了</button></header>
  <main>
    <div class="heading"><div><p class="eyebrow">FILE INSPECTION</p><h1>ファイルの検査</h1><p class="muted">受付、検査の状態、確認できた理由をひとつの画面で。</p></div><span class="environment">ローカル限定</span></div>
    <p id="message" class="notice" role="status" aria-live="polite">ローカル接続を確認しています。</p>
    <div id="application" hidden>
      <p id="gate" class="gate">現在は検証用です。顧客資料は使用できません。合成・無害・非機密のファイルだけを使用してください。</p>
      <section class="panel intake" aria-labelledby="intake-title">
        <div class="section-heading"><h2 id="intake-title">検査を依頼</h2><span class="muted">最大 250 MiB</span></div>
        <div class="intake-grid">
          <form id="file-form">
            <label id="dropzone" class="dropzone" for="file"><strong>ファイルを選択、またはここにドロップ</strong><span id="selected-file">内容はプレビューしません</span><input id="file" type="file" aria-label="検査するファイル"></label>
            <label for="file-hash">期待するSHA-256（任意）</label><input id="file-hash" type="text" pattern="[0-9a-f]{64}" maxlength="64" autocomplete="off" spellcheck="false" aria-label="ファイルの期待SHA-256">
            <div class="form-row"><label>期待する形式<select id="file-type"><option value="">指定なし</option><option value="txt">TXT</option><option value="zip">ZIP</option><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="docx">DOCX</option><option value="xlsx">XLSX</option></select></label><button id="file-submit" type="submit" disabled>ファイルを受け付ける</button></div>
          </form>
          <form id="url-form">
            <label for="source-url">直接URL</label><input id="source-url" type="url" placeholder="https://example.com/file.zip" autocomplete="off" spellcheck="false" required>
            <label for="url-hash">期待するSHA-256（任意）</label><input id="url-hash" type="text" pattern="[0-9a-f]{64}" maxlength="64" autocomplete="off" spellcheck="false" aria-label="URLの期待SHA-256">
            <div class="form-row"><label>期待する形式<select id="url-type" required><option value="zip">ZIP</option><option value="txt">TXT</option><option value="png">PNG</option><option value="jpeg">JPEG</option><option value="docx">DOCX</option><option value="xlsx">XLSX</option></select></label><button id="url-submit" type="submit">URLを受け付ける</button></div>
            <p class="hint">通信を再試行すると、同じ受付の状態を照会します。</p>
          </form>
        </div>
        <p id="receipt" class="receipt" role="status" aria-live="polite"></p>
      </section>
      <div class="workspace">
        <section class="panel jobs" aria-labelledby="jobs-title">
          <div class="section-heading"><h2 id="jobs-title">受付一覧 <span id="job-count" class="count"></span></h2><button id="refresh" class="quiet" type="button">更新</button></div>
          <div class="filters"><label for="filter">状態で絞り込む</label><select id="filter"><option value="all">すべて</option><option value="active">処理中</option><option value="PASS">合格</option><option value="HOLD">保留</option><option value="BLOCK">遮断</option><option value="stale">再検査が必要</option></select></div>
          <div id="jobs" class="job-list"></div>
          <div class="pagination"><button id="previous" class="quiet" type="button" disabled>前のページ</button><span id="page" class="muted"></span><button id="next" class="quiet" type="button" disabled>次のページ</button></div>
        </section>
        <section class="panel detail" aria-labelledby="detail-title"><div class="section-heading"><h2 id="detail-title">検査の詳細</h2></div><div id="detail"><p class="empty">一覧からジョブを選択してください。</p></div></section>
      </div>
      <footer>原本の表示・プレビューは提供しません。取り出し先は設定済みの場所から選択します。</footer>
    </div>
  </main>
</body>
</html>
